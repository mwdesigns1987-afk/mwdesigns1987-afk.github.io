name: Sync MWD Broken site
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mwdesigns1987-afk/mwd-broken
          path: _src
      - name: Build site into mwd-broken/
        run: |
          cd _src && python3 tools/unpack.py && cd ..
          rm -rf mwd-broken && mv _src/_site mwd-broken && rm -rf _src
          touch .nojekyll
      - name: Commit built site
        run: |
          git config user.name "mwd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Publish MWD Broken site" && git push)
